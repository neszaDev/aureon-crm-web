# Weekly updates, opened against dev (they reach main with the next release). Minor/patch bumps
# are grouped per ecosystem; majors arrive as separate PRs and need a deliberate review.
version: 2
updates:
  - package-ecosystem: npm # covers pnpm (package.json + pnpm-lock.yaml)
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message: { prefix: build, include: scope }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    commit-message: { prefix: ci }
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    target-branch: dev
    commit-message: { prefix: build, include: scope }
    groups:
      docker-images:
        update-types: [minor, patch]
    # The Node major is a project decision (package.json "engines"), never a routine bump.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
