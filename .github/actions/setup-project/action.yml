name: Set up Node.js and pnpm dependencies
description: Install Node.js, pnpm (version from package.json "packageManager") and dependencies

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        LEFTHOOK: '0' # git hooks are for developers, not CI
