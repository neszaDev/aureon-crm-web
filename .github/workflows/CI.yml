# CI checks. Each job runs the same command a developer runs locally:
#   verify  -> make verify  (lint, types, unused code, i18n keys, unit + UI tests, production build)
#   e2e     -> make e2e-image (frontend image + backend image + Postgres, Playwright against them)
# Runs on every PR, and is called by cd-dev.yml / cd-main.yml before anything is published,
# so pushes to dev/main are checked there (no separate push trigger here).
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build-time values only; the image gets real ones at runtime.
  BACKEND_URL: http://localhost:8080
  APP_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint reads the PR's commits
      - uses: ./.github/actions/setup-project

      - if: github.event_name == 'pull_request'
        name: Commit messages follow Conventional Commits
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - run: pnpm run typegen
      - run: pnpm run lint
      - run: pnpm run check:types
      - run: pnpm run check:deps
      - run: pnpm run check:i18n
      - name: Unit and UI tests
        run: pnpm exec playwright install --with-deps chromium && pnpm run test
      - run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Start frontend image + backend image + Postgres
        run: |
          cp env/.env.example env/.env
          docker compose --project-directory . --env-file env/.env -f docker/compose.yml \
            --profile full up -d --build --wait --wait-timeout 300
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright against the running containers
        run: pnpm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Container logs
        if: failure()
        run: docker compose --project-directory . -f docker/compose.yml --profile full logs --no-color
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
