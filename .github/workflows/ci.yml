# CI checks. Each job runs the same command a developer runs locally (see docs/ci.md):
#   checks  -> commitlint, lint, types, unused code, i18n keys   (make lint)
#   unit    -> Vitest node tests                                  (pnpm exec vitest run --project unit)
#   ui      -> Vitest browser tests                               (pnpm exec vitest run --project ui)
#   build   -> production build                                   (pnpm run build)
#   audit   -> dependency advisories + dependency review on PRs   (pnpm audit --prod)
#   e2e     -> frontend image + backend image + Postgres: API drift, Playwright, accessibility,
#              visual regression, image scan                        (make e2e-image)
#   gate    -> "CI Gate", the single required check: fails if any job above failed
# Runs on every PR, and is called by cd-dev.yml / cd-main.yml before anything is published,
# so pushes to dev/main are checked there (no separate push trigger here).
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build-time values only; the image gets real ones at runtime.
  BACKEND_URL: http://localhost:8080
  APP_URL: http://localhost:3000

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Docs-only pull requests skip the test, build and E2E jobs. Pushes (dev/main) run everything.
      - id: diff
        name: Code changed?
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qvE '(\.md$|^docs/)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  checks:
    name: Lint, types & checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # commitlint reads the PR's commits
      - uses: ./.github/actions/setup-project

      - if: github.event_name == 'pull_request'
        name: Commit messages follow Conventional Commits
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - run: pnpm run typegen
      - run: pnpm run lint
      - run: pnpm run check:types
      - run: pnpm run check:deps
      - run: pnpm run check:i18n

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - run: pnpm exec vitest run --project unit

  ui:
    name: UI tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - uses: ./.github/actions/setup-playwright
      - run: pnpm exec vitest run --project ui

  build:
    name: Production build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm run build

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: No high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level=high
      # Tooling (lint, test, Storybook) never ships; its advisories are reported, not blocking.
      - name: Advisories in development dependencies (report only)
        run: |
          pnpm audit --dev --audit-level=high \
            || echo "::warning title=Dev dependency advisories::pnpm audit --dev found high or critical advisories (not blocking)"
      - if: github.event_name == 'pull_request'
        name: New dependencies have no known vulnerabilities or disallowed licences
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  e2e:
    name: E2E, accessibility & visual
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose --project-directory . --env-file env/.env -f docker/compose.yml --profile full
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - id: stack
        name: Start frontend image + backend image + Postgres
        run: |
          cp env/.env.example env/.env
          $COMPOSE up -d --build --wait --wait-timeout 300
      - uses: ./.github/actions/setup-playwright

      # The checks below all run once the stack is up, so one failure doesn't hide the others.
      - name: API types match the backend
        run: pnpm run api:check

      - name: Playwright against the running containers (includes axe accessibility checks)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: pnpm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      # Missing baselines are written (and the step fails, so a PR can't pass by deleting them)
      # and uploaded: download the visual-baselines artifact and commit it (docs/testing.md).
      - name: Visual regression
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: pnpm exec playwright test --project=visual --update-snapshots=missing --output test-results-visual
        env:
          E2E_BASE_URL: http://localhost:3000
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-visual
      - id: baselines
        name: New visual baselines?
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain tests/visual/__screenshots__)" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=New visual baselines::Screenshots without a baseline were written. Download the visual-baselines artifact and commit it to tests/visual/__screenshots__/."
          fi
      - if: ${{ !cancelled() && steps.baselines.outputs.new == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
          retention-days: 14

      # Pinned by digest: the trivy-action tags were hijacked in 2026, so no third-party action
      # and no mutable tag runs here.
      - name: Image has no fixable high or critical vulnerabilities
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          image="$($COMPOSE config --images | grep frontend)"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"

      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-visual/
            test-results/
            test-results-visual/
          retention-days: 14

  gate:
    name: CI Gate
    # The one required status check: add, split or skip jobs without touching branch protection.
    needs: [changes, checks, unit, ui, build, audit, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed (or was skipped for a docs-only change)
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"result": "(failure|cancelled)"'; then
            echo "::error::A required CI job failed or was cancelled."
            exit 1
          fi
        env:
          RESULTS: ${{ toJSON(needs) }}
